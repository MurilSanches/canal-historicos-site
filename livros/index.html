<!doctype html>
<html lang="pt-BR">
<head>

<meta name="description" content="Livros para ler mais sobre as figuras históricas dos vídeos do Canal Históricos.">
<style>
:root { --fundo:#fff; --texto:#222; --suave:#555; --linha:#ddd; --link:#0b5cad; --cartao:#f6f7f9; }
@media (prefers-color-scheme: dark) { :root { --fundo:#15171a; --texto:#e8e8e8; --suave:#a8adb3; --linha:#2d3136; --link:#7db4f0; --cartao:#1e2125; } }
body { font-family: system-ui, sans-serif; margin: 0; line-height: 1.55; color: var(--texto); background: var(--fundo); }
header, main, footer { max-width: 40rem; margin: 0 auto; padding: 0 1rem; }
header { padding-top: 2rem; padding-bottom: .5rem; }
h1 { margin: 0; font-size: 1.6rem; }
header p { margin: .4rem 0 0; color: var(--suave); }
h2 { margin: 2rem 0 .5rem; font-size: 1.2rem; }
h3 { margin: 1rem 0 .4rem; font-size: 1rem; }
a { color: var(--link); }
ul { list-style: none; margin: 0; padding: 0; }
li { background: var(--cartao); border: 1px solid var(--linha); border-radius: 10px; margin: .4rem 0; padding: .6rem .8rem; }
li a { font-weight: 600; text-decoration: none; }
li small { display: block; color: var(--suave); }
.youtube { display: inline-block; margin-top: .8rem; padding: .5rem .9rem; border: 1px solid var(--linha); border-radius: 10px; background: var(--cartao); font-weight: 600; text-decoration: none; }
footer p { margin: 0 0 .4rem; }
footer { padding: 1.5rem 1rem 2.5rem; margin-top: 2rem; border-top: 1px solid var(--linha); color: var(--suave); font-size: .9rem; }
</style>
</head>
<body>
<header>
<h1>Livros dos nossos vídeos</h1>

<p><a class="youtube" href="https://www.youtube.com/@videosdehistoriasantigas" target="_blank" rel="noopener noreferrer">Vídeos longos no YouTube</a></p>
</header>
<main><p>Em breve: livros sobre as figuras dos nossos vídeos.</p></main>
<footer><p>Como Associado da Amazon, eu ganho com compras qualificadas.</p><a href="../">Canal Históricos</a></footer>
</body>
</html>
